services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678

  postiz:
    image: postiz/postiz
    ports:
      - "3000:3000"
    volumes:
      - postiz_data:/app/data

volumes:
  n8n_data:
  postiz_data: